# Releases (M14-T1, ADR 0098). Pushing a tag vX.Y.Z builds the six binaries .goreleaser.yaml names,
# signs checksums.txt keyless through this job's OIDC token, attests every archive's provenance,
# publishes a GitHub release, and commits the Homebrew cask to emrebdr/homebrew-tap. sdk/go's own
# tags are sdk/go/vX.Y.Z, which `v*` does not match.
#
# Run by hand, it builds a snapshot through the same signing and attestation steps and uploads dist/
# as a workflow artifact instead of publishing, so the path can be proven before a real tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

# One release per ref, never cancelled: a release stopped halfway leaves a tag with half its assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The changelog is the history since the previous tag, so the clone must carry it.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.mod
            **/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: sdk/typescript/.nvmrc
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install SDK dependencies
        run: npm ci
        working-directory: sdk/typescript

      # A tag on a commit nothing tested cannot publish.
      - name: Test
        run: make test

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # The version is the Makefile's GORELEASER_VERSION, which `make release-check` names.
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The job's own token cannot push to emrebdr/homebrew-tap; this one is scoped to that repository
          # alone (ADR 0099). A snapshot pushes nothing and needs none.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Upload snapshot
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt*
            dist/homebrew/Casks/migr.rb
