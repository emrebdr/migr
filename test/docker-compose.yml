# Databases the tagged tests run against. `make test-integration` brings these up with
# `up -d --wait`, which waits on the healthchecks below rather than on the container merely
# existing -- PostgreSQL accepts TCP well before it accepts queries, so without a healthcheck
# the first test races the server's own startup.
#
# Two PostgreSQL majors, because a lock-impact verdict is derived from the connected server's
# version and a driver that is only ever tested against one version cannot have that tested at
# all. MySQL and MariaDB are here for the same reason one step further out: the MySQL driver
# detects a variant as well as a version, and a driver that only ever meets MySQL cannot have
# that tested at all. SQLite needs no container.
#
# Both MySQL services mount initdb/grant-process.sql, which grants the one privilege the
# lock-impact tests need and migr itself never uses -- see that file. An existing volume predates
# it, so `docker compose down -v` once is what picks it up.
#
# Ports are non-default so this never collides with a server an operator is already running.
# The DSNs matching these are the defaults in internal/driver/postgres and internal/driver/mysql;
# override with MIGR_TEST_PG16_DSN, MIGR_TEST_PG17_DSN, MIGR_TEST_MYSQL80_DSN and
# MIGR_TEST_MARIADB114_DSN.

services:
  postgres16:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: migr
      POSTGRES_PASSWORD: migr
      POSTGRES_DB: migr
    ports:
      - "55416:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migr -d migr"]
      interval: 1s
      timeout: 3s
      retries: 30

  postgres17:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: migr
      POSTGRES_PASSWORD: migr
      POSTGRES_DB: migr
    ports:
      - "55417:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migr -d migr"]
      interval: 1s
      timeout: 3s
      retries: 30

  # The healthcheck runs a real query as the real user rather than mysqladmin ping, because the
  # MySQL entrypoint starts a temporary server to initialise the data directory and a ping
  # answers from that one -- so `up --wait` would return before the migr user exists.
  mysql80:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: migr
      MYSQL_USER: migr
      MYSQL_PASSWORD: migr
      MYSQL_DATABASE: migr
    ports:
      - "55480:3306"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u migr -pmigr -e 'SELECT 1' migr"]
      interval: 1s
      timeout: 5s
      retries: 60

  # healthcheck.sh ships in the MariaDB image and is its documented answer to the same problem:
  # --connect proves the real server is accepting connections, --innodb_initialized that the
  # engine every test needs is up.
  mariadb114:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: migr
      MARIADB_USER: migr
      MARIADB_PASSWORD: migr
      MARIADB_DATABASE: migr
    ports:
      - "55411:3306"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 1s
      timeout: 5s
      retries: 60
