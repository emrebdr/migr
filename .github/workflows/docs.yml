# Publishes the documentation site (M14-T5) to GitHub Pages: docs/ built by VitePress on every push to
# main that touches a page, or by hand. CI's check job builds the same site on every change, so what
# reaches here has already passed the dead-link check.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "sdk/typescript/README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push replaces one still waiting rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: sdk/typescript/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build
        run: make docs

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
