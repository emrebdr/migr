# CI runs the same Makefile targets a developer runs locally, rather than
# reimplementing them in YAML. That keeps the local gate and the remote gate
# identical, and means the multi-module loop is inherited for free -- a bare
# `go test ./...` here would silently skip the nested sdk/go module.
#
# macos-latest is not redundant with ubuntu-latest: GitHub's macOS runners ship
# GNU Make 3.81, so it is the only leg that exercises the 3.81 compatibility the
# Makefile was written for.

name: CI

on:
  push:
    branches: [main]
  # PR branches are covered here; limiting push to main avoids duplicate runs.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one OS must not hide the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Key off both: the root module has a go.sum, sdk/go has none, and the
          # default '**/go.sum' glob alone would error on the module that lacks
          # one. Including go.mod covers sdk/go and re-keys when a dependency
          # is added or removed.
          cache-dependency-path: |
            **/go.mod
            **/go.sum

      # M7-T1 gave the Makefile a second toolchain: ts_run is gated on
      # sdk/typescript/package.json, so lint, test, and build all invoke npm now
      # that it exists. Without this step they would fail on a missing node.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: sdk/typescript/.nvmrc
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      # npm ci rather than `make tools`, which installs it too: that step is skipped
      # on a tools cache hit, and the dependencies would then silently not be there.
      - name: Install SDK dependencies
        run: npm ci
        working-directory: sdk/typescript

      - name: Report toolchain
        run: |
          make --version | head -1
          go version
          node --version

      # Read the pinned version out of the Makefile rather than restating it.
      # Hard-coding it here would recreate the two-places-to-update drift that
      # choosing `make tools` over golangci-lint-action was meant to avoid.
      - name: Resolve pinned tool version
        id: tools
        run: echo "version=$(awk '/^GOLANGCI_VERSION/ {print $3}' Makefile)" >> "$GITHUB_OUTPUT"

      # The tool alone, never the whole of bin: that directory also holds the bin/migr
      # `make build` writes, and a cache saved after one run restored that run's migr into
      # every later one -- which the SDK test helpers, running before Build, then drove.
      - name: Cache dev tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ steps.tools.outputs.version }}

      - name: Install dev tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: make tools

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build

      # The cross-language proof (M7-T7). It is behind the conformance tag because it
      # needs Node, which `make test` may not have -- but this job installs Node on both
      # OS legs, so here it runs rather than being something only a laptop ever proves.
      # It comes after Build, which has already produced the SDK's dist.
      - name: Conformance tests
        run: make test-conformance

      - name: Smoke run
        run: ./bin/migr

      # The site deploys from main alone, so a dead link or a page Vue cannot compile fails here, on the
      # change that broke it. One OS is enough: the build reads files.
      - name: Docs
        if: matrix.os == 'ubuntu-latest'
        run: make docs

      # The release job runs .goreleaser.yaml only on a tag, so a config it would refuse is caught here,
      # on the change that broke it. One OS is enough: the check reads a file.
      - name: Release config
        if: matrix.os == 'ubuntu-latest'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check

  # The tagged tests are the only ones that can say whether the SQL this repository
  # emits is right rather than merely plausible, and until this job existed nothing
  # ran them outside a developer's laptop. ubuntu-latest only: GitHub's macOS runners
  # ship no Docker daemon, which is why the job above keeps the OS matrix and this
  # one does not.
  #
  # `make test-integration` brings the databases up itself, with `up -d --wait` on the
  # healthchecks, so there is no services: block here and no wait loop. It does not
  # need `make tools` either -- that target installs golangci-lint, and this job lints
  # nothing. It does need Node from M7-T8 on: the suite runs a TypeScript project, and
  # the target builds the SDK it starts.
  #
  # Three parallel legs, one per slice of the packages, each starting only the servers it drives. This
  # is not the per-engine matrix M9-T7 rejected, which would repeat the whole suite per server: each
  # driver package still holds its own list of servers, and each leg runs different packages. The
  # postgres package alone outlasted go test's ten-minute default with every package queued on one
  # runner. Only the rest -- the end-to-end suite, which runs a TypeScript project -- needs Node.
  integration:
    name: integration (${{ matrix.slice }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: postgres
            only: ./internal/driver/postgres/
            services: postgres16 postgres16standby postgres17
          - slice: mysql
            only: ./internal/driver/mysql/
            services: mysql80 mysql80replica mysql80gtid mariadb114 mariadb114binlog
          - slice: rest
            exclude: .*/internal/driver/(postgres|mysql)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.mod
            **/go.sum

      - name: Set up Node
        if: matrix.slice == 'rest'
        uses: actions/setup-node@v4
        with:
          node-version-file: sdk/typescript/.nvmrc
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install SDK dependencies
        if: matrix.slice == 'rest'
        run: npm ci
        working-directory: sdk/typescript

      - name: Integration tests
        run: >-
          make test-integration INT_ONLY="${{ matrix.only }}"
          INT_EXCLUDE="${{ matrix.exclude }}" INT_SERVICES="${{ matrix.services }}"

      # A driver's live tests fail rather than skip when their server is absent -- so a failure here
      # is either the SQL or a server that never came healthy, and nothing in the Go output tells
      # those apart.
      - name: Report server state
        if: failure()
        run: docker compose -f test/docker-compose.yml ps

  # The release images (M14-T4, ADR 0101), run as a pipeline runs them: each built from the release's
  # own Dockerfile over this commit's binary, a project mounted at /work, against compose's postgres17.
  # The TypeScript half needs the SDK built, so this job sets up Node too.
  docker:
    name: docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.mod
            **/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: sdk/typescript/.nvmrc
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install SDK dependencies
        run: npm ci
        working-directory: sdk/typescript

      - name: Image tests
        run: make test-docker

      - name: Report server state
        if: failure()
        run: docker compose -f test/docker-compose.yml ps

  # The zero-downtime suite (M13-T12, ADR 0096): every operation against every server under client
  # load, each held to the lock cost it declares. A job of its own, one runner per driver, because it
  # judges latency: sharing a runner with the integration tests, or with another driver's suite, put
  # one driver's million-row rewrites on the disk another's client reads were being timed against.
  # Each leg starts only the servers its driver runs against, and SQLite's starts none.
  zerodowntime:
    name: zero-downtime (${{ matrix.servers || matrix.driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: postgres
            services: postgres16 postgres17
          - driver: mysql
            servers: mysql
            services: mysql80 mysql80gtid
          - driver: mysql
            servers: mariadb
            services: mariadb114 mariadb114binlog
          - driver: sqlite
            services: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.mod
            **/go.sum

      - name: Zero-downtime suite
        run: >-
          make test-zerodowntime ZD_PACKAGES=./internal/driver/${{ matrix.driver }}/
          ZD_SERVERS="${{ matrix.servers }}" ZD_SERVICES="${{ matrix.services }}"

      - name: Report server state
        if: failure() && matrix.driver != 'sqlite'
        run: docker compose -f test/docker-compose.yml ps
