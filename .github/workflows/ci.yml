# CI runs the same Makefile targets a developer runs locally, rather than
# reimplementing them in YAML. That keeps the local gate and the remote gate
# identical, and means the multi-module loop is inherited for free -- a bare
# `go test ./...` here would silently skip the nested sdk/go module.
#
# macos-latest is not redundant with ubuntu-latest: GitHub's macOS runners ship
# GNU Make 3.81, so it is the only leg that exercises the 3.81 compatibility the
# Makefile was written for.

name: CI

on:
  push:
    branches: [main]
  # PR branches are covered here; limiting push to main avoids duplicate runs.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one OS must not hide the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Key off both: the root module has a go.sum, sdk/go has none, and the
          # default '**/go.sum' glob alone would error on the module that lacks
          # one. Including go.mod covers sdk/go and re-keys when a dependency
          # is added or removed.
          cache-dependency-path: |
            **/go.mod
            **/go.sum

      # M7-T1 gave the Makefile a second toolchain: ts_run is gated on
      # sdk/typescript/package.json, so lint, test, and build all invoke npm now
      # that it exists. Without this step they would fail on a missing node.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: sdk/typescript/.nvmrc
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      # npm ci rather than `make tools`, which installs it too: that step is skipped
      # on a tools cache hit, and the dependencies would then silently not be there.
      - name: Install SDK dependencies
        run: npm ci
        working-directory: sdk/typescript

      - name: Report toolchain
        run: |
          make --version | head -1
          go version
          node --version

      # Read the pinned version out of the Makefile rather than restating it.
      # Hard-coding it here would recreate the two-places-to-update drift that
      # choosing `make tools` over golangci-lint-action was meant to avoid.
      - name: Resolve pinned tool version
        id: tools
        run: echo "version=$(awk '/^GOLANGCI_VERSION/ {print $3}' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Cache dev tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ steps.tools.outputs.version }}

      - name: Install dev tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: make tools

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build

      # The cross-language proof (M7-T7). It is behind the conformance tag because it
      # needs Node, which `make test` may not have -- but this job installs Node on both
      # OS legs, so here it runs rather than being something only a laptop ever proves.
      # It comes after Build, which has already produced the SDK's dist.
      - name: Conformance tests
        run: make test-conformance

      - name: Smoke run
        run: ./bin/migr

  # The tagged tests are the only ones that can say whether the SQL this repository
  # emits is right rather than merely plausible, and until this job existed nothing
  # ran them outside a developer's laptop. ubuntu-latest only: GitHub's macOS runners
  # ship no Docker daemon, which is why the job above keeps the OS matrix and this
  # one does not.
  #
  # `make test-integration` brings the databases up itself, with `up -d --wait` on the
  # healthchecks, so there is no services: block here and no wait loop. It does not
  # need `make tools` either -- that target installs golangci-lint, and this job lints
  # nothing. It does need Node from M7-T8 on: the suite runs a TypeScript project, and
  # the target builds the SDK it starts.
  #
  # All four servers, and still no strategy.matrix over them (M9-T7). One invocation of
  # that target runs every tagged package against every server already: each driver
  # holds its own table-driven list -- two PostgreSQL majors, MySQL 8.0 and MariaDB 11.4
  # -- so a per-engine matrix would repeat the whole suite four times for the same
  # assertions, and would need compose profiles and new Makefile surface no local gate
  # uses. A server that never came healthy is identified by the last step instead.
  integration:
    name: integration (postgres 16/17, mysql 8.0, mariadb 11.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.mod
            **/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: sdk/typescript/.nvmrc
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install SDK dependencies
        run: npm ci
        working-directory: sdk/typescript

      - name: Integration tests
        run: make test-integration

      # The zero-downtime suite (M13-T12, ADR 0096): every operation against every server under
      # client load, each held to the lock cost it declares. Here, after the integration tests,
      # because it needs the same containers and the target leaves them running.
      - name: Zero-downtime suite
        run: make test-zerodowntime

      # Four containers now, and a driver's live tests fail rather than skip when their
      # server is absent -- so a failure here is either the SQL or a server that never
      # came healthy, and nothing in the Go output tells those apart.
      - name: Report server state
        if: failure()
        run: docker compose -f test/docker-compose.yml ps
