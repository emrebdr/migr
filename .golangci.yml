# golangci-lint configuration for migr. Pinned version lives in the Makefile.
#
# Shared by both Go modules (root and sdk/go); the Makefile passes --config with an
# absolute path so the nested module cannot silently get a different one.
#
# Every enabled linter traces to a CLAUDE.md rule or to a bug class a migration tool
# actually ships. Style linters that generate churn without catching defects are
# deliberately absent.
#
# Validate changes with:  ./bin/golangci-lint config verify

version: "2"

# A tagged file is invisible to every linter unless the tag is named here: golangci-lint loads
# packages under the default build constraints, and `make lint` passes no flags. Without this,
# internal/driver/postgres's integration tests would be checked by internal/lint's comment walk
# and by nothing else. Adding a tag is purely additive -- untagged files still build.
run:
  build-tags:
    - integration

linters:
  default: none

  enable:
    # Required by M0-T3.
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - importas

    # golangci-lint's standard set, kept.
    - ineffassign
    - unused

    # Database correctness. A migration tool that leaks *sql.Rows or skips
    # rows.Err() corrupts exactly the thing it exists to protect.
    - sqlclosecheck
    - rowserrcheck
    - bodyclose
    - noctx

    # CLAUDE.md invariants, made mechanical.
    - depguard # #1 and #2: import boundaries
    - errorlint # #9: wrap with %w
    - forbidigo # #8: deterministic planning; #9: no panic in library code
    - exhaustive # total switches over the IR operation set

    # Guards the //nolint: exemption in internal/lint (M0-T10). That check skips any
    # comment beginning //nolint:, so without nolintlint a bare directive would smuggle
    # arbitrary commentary into a function body.
    - nolintlint

    # Cheap, low false-positive correctness checks.
    - misspell
    - copyloopvar
    - intrange
    - nilerr
    - unconvert
    - predeclared
    - wastedassign

  settings:
    # Enforces the alias convention recorded in internal/runtime/doc.go: our
    # package is imported plain, the stdlib one is aliased. no-unaliased is what
    # makes this a rule rather than a suggestion.
    importas:
      no-unaliased: true
      alias:
        - pkg: runtime
          alias: stdruntime

    # Invariant #1: only cmd/migr may import a concrete driver or runtime.
    #
    # Stated as a blanket deny with cmd/migr carved out, rather than as a list of
    # core packages. depguard sees only direct imports, so covering everything
    # except the wiring layer is what closes the transitive path -- a route from
    # core to a driver through some intermediate package is caught at that
    # intermediate package. It also means a new core package or a fourth driver is
    # governed the day it is created rather than the day someone updates a list.
    #
    # The trailing slashes are load-bearing. deny is a prefix match, so
    # ".../internal/driver/" covers every driver package while leaving
    # ".../internal/driver" -- the Driver interface that core legitimately depends
    # on -- importable. Dropping a slash would deny the contract itself.
    #
    # list-mode lax lets a longer allow prefix beat a shorter deny -- strictly
    # longer, per depguard's own resolution -- which is how internal/runtime/protocol
    # stays importable: it is shared wire-protocol code, not a language
    # implementation. internal/driver/drivertest is the same shape: the golden-file
    # harness every driver's compiler is held to, plus the operation set M2-T4 walks.
    # Both are allowed to everyone, so neither may ever import a concrete driver --
    # that would reopen the transitive path this rule exists to close.
    #
    # If a driver ever grows a subpackage (internal/driver/postgres/lock), this
    # blanket deny will block the driver from importing its own child; that driver
    # then needs a negated files entry here.
    depguard:
      rules:
        implementations:
          list-mode: lax
          files:
            - "**/*.go"
            - "!**/cmd/migr/**"
          allow:
            - github.com/emrebdr/migr/internal/runtime/protocol
            - github.com/emrebdr/migr/internal/driver/drivertest
          deny:
            - pkg: github.com/emrebdr/migr/internal/driver/
              desc: >-
                only cmd/migr may import a concrete driver; core reaches drivers
                through the registry (CLAUDE.md invariant #1). Drivers must not
                import one another (invariant #2)
            - pkg: github.com/emrebdr/migr/internal/runtime/
              desc: >-
                only cmd/migr may import a concrete language runtime; core reaches
                runtimes through the registry (CLAUDE.md invariant #1)

        # Invariant #1 again, for a shape it did not anticipate. internal/source/sql
        # is a concrete implementation of engine.Source, so core must not name it --
        # but unlike a driver, it is not registry-wired: internal/cli builds it and
        # hands it to the engine (M5-T1 writes the template, M5-T2 the parser). The
        # carve-out is therefore cli as well as cmd/migr, and it is a separate rule
        # set precisely so that widening it here does not widen the driver deny
        # above, which cli is still held to.
        sources:
          list-mode: lax
          files:
            - "**/*.go"
            - "!**/cmd/migr/**"
            - "!**/internal/cli/**"
          deny:
            - pkg: github.com/emrebdr/migr/internal/source/
              desc: >-
                only cmd/migr and internal/cli may name a concrete migration source;
                the engine reaches one through engine.Source (CLAUDE.md invariant #1)

    # Listing rules REPLACES revive's defaults rather than extending them, so this
    # set is complete rather than incremental.
    #
    # package-comments is deliberately absent: it demands "Package main ...", but
    # Go's convention for a command is "Command migr ...", which cmd/migr/main.go
    # correctly uses. Enabling it would force a violation of the standard to
    # satisfy the linter.
    revive:
      rules:
        - name: exported
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming

    # analyze-types resolves the call through the type checker, so a shadowed or
    # dot-imported time package cannot slip past a textual match.
    # Listing forbid REPLACES forbidigo's defaults, so the print patterns are
    # restated here rather than inherited; the cmd/ and internal/cli/ exclusion
    # below is what lets the CLI layer print.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print(|f|ln)$
          msg: >-
            library code returns values and errors; printing belongs in
            cmd/ or internal/cli/
        - pattern: ^(print|println)$
          msg: builtin print writes to stderr and is not for production code
        - pattern: ^time\.Now$
          msg: >-
            planning paths must be deterministic — inject a clock
            (CLAUDE.md invariant #8)
        # Matches the source expression (rand.Intn), not the import path;
        # ^math/rand\. silently never fires. Covers crypto/rand too, which is
        # intended: planning paths tolerate no nondeterminism from any source.
        #
        # For math/rand specifically, gosec's G404 sits at the identical
        # file:line:col and golangci-lint deduplicates by position, so G404's
        # message is what gets printed. The rule is working -- verified with
        # `-D gosec` -- and the build fails either way.
        - pattern: ^rand\..*$
          msg: >-
            planning paths must be deterministic — no randomness
            (CLAUDE.md invariant #8)
        - pattern: ^panic$
          msg: >-
            return an error instead; panic only in main for unrecoverable
            startup failures (CLAUDE.md invariant #9)

    # CLAUDE.md §9 requires a nolint inside a function to name the linter and give a
    # reason on the same line. These three settings are that rule, mechanically:
    # require-specific rejects a bare //nolint, require-explanation rejects one without a
    # reason, and allow-unused false stops a stale directive outliving the issue it
    # silenced. The machine-readable form ("//nolint", never "// nolint") is checked by
    # default and is what golangci-lint itself requires.
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    exhaustive:
      default-signifies-exhaustive: true

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    gosec:
      excludes:
        - G104 # duplicate of errcheck

    misspell:
      locale: US
      ignore-rules:
        - importas # a linter name, not a misspelling of "imports"

  exclusions:
    generated: lax
    # The `comments` preset is deliberately absent: it suppresses exactly the
    # "comment on exported X should be of the form ..." messages that revive's
    # exported rule exists to produce, which would make M0-T3's requirement
    # decorative. std-error-handling is what keeps unchecked fmt.Println and
    # os.Remove out of errcheck.
    presets:
      - common-false-positives
      - legacy
      - std-error-handling

    rules:
      # A CLI's job is to write to stdout. forbidigo stays on everywhere else so
      # library code cannot print instead of returning.
      - path: (^cmd/|^internal/cli/)
        linters:
          - forbidigo

      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - noctx

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/emrebdr/migr

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
