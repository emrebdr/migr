# Databases the tagged tests run against. `make test-integration` brings these up with
# `up -d --wait`, which waits on the healthchecks below rather than on the container merely
# existing -- PostgreSQL accepts TCP well before it accepts queries, so without a healthcheck
# the first test races the server's own startup.
#
# Two PostgreSQL majors, because a lock-impact verdict is derived from the connected server's
# version and a driver that is only ever tested against one version cannot have that tested at
# all. MySQL and MariaDB are here for the same reason one step further out: the MySQL driver
# detects a variant as well as a version, and a driver that only ever meets MySQL cannot have
# that tested at all. SQLite needs no container.
#
# Both MySQL services mount initdb/grant-process.sql, which grants the one privilege the
# lock-impact tests need and migr itself never uses -- see that file. An existing volume predates
# it, so `docker compose down -v` once is what picks it up.
#
# Two replicas lag behind on purpose (M13-T8): postgres16standby replays postgres16's WAL three
# seconds late, and mysql80replica applies mysql80's migr_lag database three seconds late. They exist
# so replica-lag pacing is measured against real lag rather than a fake, and every other suite
# ignores them.
#
# postgres17 runs wal_level=logical and postgres16 does not (M13-T16), so each driver's capture fact is
# read from a server that permits log-based change capture and from one that refuses it by name.
#
# The MySQL services also mount initdb/grant-replication.sql, so the test user can read the binary log
# a shadow-table migration keeps its copy current from, and mysql80gtid is the one MySQL that records
# GTIDs (M13-T10): a shadow's position is a GTID set there and a file and offset on mysql80.
#
# Ports are non-default so this never collides with a server an operator is already running.
# The DSNs matching these are the defaults in internal/driver/postgres and internal/driver/mysql;
# override with MIGR_TEST_PG16_DSN, MIGR_TEST_PG17_DSN, MIGR_TEST_MYSQL80_DSN and
# MIGR_TEST_MARIADB114_DSN.

services:
  postgres16:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: migr
      POSTGRES_PASSWORD: migr
      POSTGRES_DB: migr
    ports:
      - "55416:5432"
    volumes:
      - ./initdb-pg:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migr -d migr"]
      interval: 1s
      timeout: 3s
      retries: 30

  # A streaming standby of postgres16, replaying three seconds late, so the replica-lag tests read a
  # real and predictable replay_lag from pg_stat_replication on the primary (M13-T8). It is a
  # physical copy of the whole cluster, so nothing another suite does can break it.
  postgres16standby:
    image: postgres:16-alpine
    depends_on:
      postgres16:
        condition: service_healthy
    user: postgres
    environment:
      PGPASSWORD: migr
    entrypoint: ["/bin/sh", "/standby/standby.sh"]
    volumes:
      - ./standby:/standby:ro
    ports:
      - "55426:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U migr -d migr"]
      interval: 1s
      timeout: 3s
      retries: 60

  # wal_level=logical on this major alone, so one PostgreSQL in compose permits log-based change
  # capture and the other refuses it for wal_level -- each driver's capture fact is read from the
  # server, and a fact only ever read as one answer has not been tested (M13-T16).
  postgres17:
    image: postgres:17-alpine
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: migr
      POSTGRES_PASSWORD: migr
      POSTGRES_DB: migr
    ports:
      - "55417:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migr -d migr"]
      interval: 1s
      timeout: 3s
      retries: 30

  # The healthcheck runs a real query as the real user rather than mysqladmin ping, because the
  # MySQL entrypoint starts a temporary server to initialise the data directory and a ping
  # answers from that one -- so `up --wait` would return before the migr user exists.
  mysql80:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: migr
      MYSQL_USER: migr
      MYSQL_PASSWORD: migr
      MYSQL_DATABASE: migr
    ports:
      - "55480:3306"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u migr -pmigr -e 'SELECT 1' migr"]
      interval: 1s
      timeout: 5s
      retries: 60

  # A replica of mysql80 applying three seconds late, so the replica-lag tests read a real and
  # predictable Seconds_Behind_Source (M13-T8). It replicates migr_lag alone -- initdb/lag-database.sql
  # says why -- from the source's position when it came up.
  mysql80replica:
    image: mysql:8.0
    depends_on:
      mysql80:
        condition: service_healthy
    command: ["--server-id=2", "--replicate-do-db=migr_lag"]
    environment:
      MYSQL_ROOT_PASSWORD: migr
      MYSQL_USER: migr
      MYSQL_PASSWORD: migr
      MYSQL_DATABASE: migr_lag
    ports:
      - "55490:3306"
    volumes:
      - ./initdb-replica:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u migr -pmigr -e 'SELECT 1' migr_lag"]
      interval: 1s
      timeout: 5s
      retries: 90

  # A MySQL 8.0 that records a GTID for every transaction, so a shadow-table migration's recorded
  # position is read back as a GTID set on one server and as a file and offset on mysql80 (M13-T10).
  # Only the shadow-table suites use it.
  mysql80gtid:
    image: mysql:8.0
    command: ["--server-id=3", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: migr
      MYSQL_USER: migr
      MYSQL_PASSWORD: migr
      MYSQL_DATABASE: migr
    ports:
      - "55481:3306"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u migr -pmigr -e 'SELECT 1' migr"]
      interval: 1s
      timeout: 5s
      retries: 60

  # healthcheck.sh ships in the MariaDB image and is its documented answer to the same problem:
  # --connect proves the real server is accepting connections, --innodb_initialized that the
  # engine every test needs is up.
  mariadb114:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: migr
      MARIADB_USER: migr
      MARIADB_PASSWORD: migr
      MARIADB_DATABASE: migr
    ports:
      - "55411:3306"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 1s
      timeout: 5s
      retries: 60
